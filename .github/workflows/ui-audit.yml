name: Full screen UI audit
on:
  pull_request:
  push:
    branches: [main]
concurrency:
  group: ui-audit-${{ github.ref }}
  cancel-in-progress: true
jobs:
  regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/*.test.cjs
  browsers:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    container:
      image: mcr.microsoft.com/playwright:v1.56.1-noble
      options: --ipc=host
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, webkit]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - run: node tests/pixel-browser.cjs
        env:
          BROWSER: ${{ matrix.browser }}
      - run: node tests/management-browser.cjs
        env:
          BROWSER: ${{ matrix.browser }}
      - run: node tests/plain-copy-browser.cjs
        env:
          BROWSER: ${{ matrix.browser }}
      - run: node tests/presentation-refresh-browser.cjs
        env:
          BROWSER: ${{ matrix.browser }}
      - run: node tests/character-forecast-browser.cjs
        env:
          BROWSER: ${{ matrix.browser }}
      - run: node tests/pixel-upgrade.cjs
        env:
          BROWSER: ${{ matrix.browser }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: full-screen-${{ matrix.browser }}
          path: test-artifacts/
  production:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [regression, browsers]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    container:
      image: mcr.microsoft.com/playwright:v1.56.1-noble
      options: --ipc=host
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, webkit]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - run: node tests/wait-public.cjs
      - run: node tests/pixel-browser.cjs
        env:
          BROWSER: ${{ matrix.browser }}
          BASE_URL: https://reyanyan0126.github.io/okyakusama-game/
          AUDIT_PHASE: public
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: public-screens-${{ matrix.browser }}
          path: test-artifacts/
