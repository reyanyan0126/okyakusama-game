name: Game regression tests
on:
  pull_request:
  push:
    branches: [main]
concurrency:
  group: game-regression-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Current game, save compatibility, finance, story and art regression suite
        run: node --test tests/*.test.cjs
      # Browser assertions now live in ui-audit.yml: six widths, both engines,
      # all branches and a full 30-week DOM campaign. Version-specific visual
      # snapshots remain in tests/ as historical references, not current gates.
