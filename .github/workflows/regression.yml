name: Game regression tests
on:
  pull_request:
  push:
    branches:
      - main
      - feature/v1.1.0-four-choice-compact
      - feature/v1.2.0-outcomes-comedy
      - feature/v1.3.0-consequence-arcs
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run Node game tests
        run: |
          for test in tests/crisis-v100.test.cjs tests/four-choice-v110.test.cjs tests/outcome-v120.test.cjs tests/story-v130.test.cjs tests/onboarding-v101.test.cjs tests/ui-smoke.test.cjs tests/v099-campaign.test.cjs tests/finance-v094.test.cjs tests/v095-rootcause.test.cjs; do node "$test"; done
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install browser test dependencies
        run: |
          python -m pip install playwright
          python -m playwright install --with-deps chromium
      - name: Test first-run tutorial, resume and four-choice policies and dashboard
        run: |
          python tests/onboarding-v101.py
          python tests/dashboard-v110.py
          python tests/outcome-v120.py
          python tests/story-v130.py
