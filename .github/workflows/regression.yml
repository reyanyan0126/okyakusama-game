name: Game regression tests
on:
  pull_request:
  push:
    branches:
      - main
      - feature/v1.8.0-gameplay-refinement
      - feature/v1.1.0-four-choice-compact
      - feature/v1.2.0-outcomes-comedy
      - feature/v1.3.0-consequence-arcs
      - feature/v1.4.0-week-theater
      - feature/v1.5.0-art-storyboards
      - feature/v1.6.0-story-incidents
      - feature/v1.6.1-cast-layout
      - feature/v1.7.0-scene-cinema
      - feature/v1.7.1-office-story-art
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check v2.0 strategy experiment controls
        run: |
          node tests/manga-v200.test.cjs
          node tests/manga-v200.test.cjs
          node tests/chapter-finales-v200.test.cjs
          node tests/strategy-advisor-v200.test.cjs
          node tests/consequences-v200.test.cjs
          node tests/backup-v200.test.cjs
          node tests/boardroom-v200.test.cjs
          node tests/achievements-v200.test.cjs
          node tests/trends-v200.test.cjs
          node tests/strategy-v200.test.cjs
          STRATEGY_SEEDS=12 node tests/strategy-v200.cjs /tmp/strategy-v200-smoke.json
      - name: Run Node game tests
        run: |
          for test in tests/refinement-v180.test.cjs tests/crisis-v100.test.cjs tests/four-choice-v110.test.cjs tests/outcome-v120.test.cjs tests/story-v130.test.cjs tests/theater-v140.test.cjs tests/storyboards-v150.test.cjs tests/art-v160.test.cjs tests/cast-layout-v161.test.cjs tests/cinema-v170.test.cjs tests/office-v171.test.cjs tests/onboarding-v101.test.cjs tests/ui-smoke.test.cjs tests/v099-campaign.test.cjs tests/finance-v094.test.cjs tests/v095-rootcause.test.cjs; do echo "RUNNING $test"; timeout 45s node "$test"; done
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install browser test dependencies
        run: |
          python -m pip install playwright==1.51.0
          python -m playwright install --with-deps chromium webkit
      - name: Test first-run tutorial, resume and four-choice policies and dashboard
        run: |
          python tests/manga-v200.py
          python tests/manga-v200.py
          python tests/chapter-finales-v200.py
          python tests/strategy-advisor-v200.py
          python tests/consequences-v200.py
          python tests/backup-v200.py
          python tests/boardroom-v200.py
          python tests/achievements-v200.py
          python tests/trends-v200.py
          python tests/refinement-v180.py
          python tests/office-v171.py
          python tests/onboarding-v101.py
          python tests/dashboard-v110.py
          python tests/outcome-v120.py
          python tests/story-v130.py
          python tests/theater-v140.py
          python tests/storyboards-v150.py
          python tests/art-v160.py
          python tests/cast-layout-v161.py
          python tests/cinema-v170.py
