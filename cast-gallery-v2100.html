<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f7f1e7">
<meta name="description" content="『お客様のために。』登場人物5人・各5表情を紹介する公式ギャラリー">
<title>登場人物ギャラリー｜お客様のために。</title>
<link rel="stylesheet" href="./cast-gallery-v2100.css">
<script defer src="./cast-gallery-v2100.js"></script>
</head>
<body>
<main class="gallery">
<header class="gallery-header">
<a class="back" href="./index.html">← ゲームへ戻る</a>
<p class="eyebrow">MOGUMOGU MART / CHARACTER FILES</p>
<h1>登場人物ギャラリー</h1>
<p>崖っぷちの経営を支えるのは、クセのある5人。キャラクターを選んで、表情を切り替えてみてね。</p>
</header>
<div class="layout">
<nav class="cast-panel" aria-label="登場人物を選択">
<h2>登場人物</h2>
<div id="castList" class="cast-list"></div>
</nav>
<section class="detail-panel" aria-labelledby="castName">
<div class="tagline">CHARACTER PROFILE</div>
<h2 id="castName">主人公</h2>
<p id="castRole" class="cast-role">経営コンサルタント</p>
<div class="art-stage"><svg id="castPortrait" role="img" aria-label="主人公の通常表情" viewBox="0 0 100 120"><use href="./assets/manga-cast-v200.svg#manga-you-normal"></use></svg></div>
<div class="mood-header"><h3>表情を選ぶ</h3><span id="moodStatus" aria-live="polite">通常</span></div>
<div class="mood-picks" id="moodPicks" role="group" aria-label="表情"></div>
<p id="castDescription" class="cast-description"></p>
</section>
</div>
<footer>
<p>このギャラリーでは既存の完成済みSVGを使っています。新規高精細人物原画25枚は別途制作・審査中です。</p>
<p>ゲームをプレイしなくても閲覧できます。選択してもセーブデータや経営成績は変わりません。</p>
<a href="./index.html">ゲーム本編へ戻る →</a>
</footer>
</main>
</body>
</html>
